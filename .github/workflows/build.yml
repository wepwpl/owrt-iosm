name: Build OpenWrt x86 iosm

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Kosongkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pasang dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget libelf-dev

      - name: Clone OpenWrt v25.12.3
        run: git clone --depth 1 --branch v25.12.3 https://github.com/openwrt/openwrt.git

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Tambah paket kmod-iosm
        working-directory: openwrt
        run: |
          cat >> package/kernel/linux/modules/wwan.mk <<'EOF'

          define KernelPackage/iosm
            SUBMENU:=WWAN Support
            TITLE:=Intel IOSM WWAN driver (XMM7360/7560)
            DEPENDS:=@PCI_SUPPORT +kmod-wwan
            KCONFIG:=CONFIG_IOSM
            FILES:=$(LINUX_DIR)/drivers/net/wwan/iosm/iosm.ko
            AUTOLOAD:=$(call AutoProbe,iosm)
          endef

          define KernelPackage/iosm/description
            Driver kernel untuk modem Intel XMM7360/7560 (Fibocom L850/L860) mode PCIe.
          endef

          $(eval $(call KernelPackage,iosm))
          EOF

      - name: Konfigurasi
        working-directory: openwrt
        run: |
          curl -fL https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/config.buildinfo -o .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-iosm=y
          CONFIG_PACKAGE_kmod-wwan=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          EOF
          make defconfig
          grep -q "CONFIG_PACKAGE_kmod-iosm=y" .config || { echo "kmod-iosm tidak aktif"; exit 1; }
          grep -i -E "iosm|modemmanager|mwan3" .config

      - name: Build
        working-directory: openwrt
        run: |
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Rilis
        working-directory: openwrt
        run: |
          cd bin/targets/x86/64
          sha256sum *combined-efi* > sha256sums.txt
          ls -lh

      - name: Upload ke Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenWrt 25.12.3 x86 iosm (build ${{ github.run_number }})
          files: |
            openwrt/bin/targets/x86/64/*combined-efi*
            openwrt/bin/targets/x86/64/sha256sums.txt
