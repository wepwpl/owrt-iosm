name: Build kmod-iosm ImmortalWrt 24.10.2

on:
  workflow_dispatch:

env:
  IMMORTAL_VER: "24.10.2"
  TARGET: "x86"
  SUBTARGET: "64"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd curl

      - name: Download ImmortalWrt 24.10.2 SDK
        run: |
          SDK_URL="https://immortalwrt.org{IMMORTAL_VER}/targets/${TARGET}/${SUBTARGET}/"
          SDK_FILE=$(curl -s "$SDK_URL" | grep -oE "immortalwrt-sdk-${IMMORTAL_VER}-${TARGET}-${SUBTARGET}_[^\"]+\.tar\.(xz|zst)" | head -n 1)
          echo "Downloading: $SDK_FILE"
          wget -q "${SDK_URL}${SDK_FILE}"
          tar -xf "$SDK_FILE"
          mv immortalwrt-sdk-* sdk

      - name: Add kmod-iosm Definition
        run: |
          cd sdk
          ./scripts/feeds update base
          cat << 'EOF' >> package/kernel/linux/modules/wwan.mk

          define KernelPackage/iosm
            SUBMENU:=$(WWAN_MENU)
            TITLE:=Intel IOSM PCIe modem driver
            DEPENDS:=@PCI_SUPPORT +kmod-wwan
            KCONFIG:=CONFIG_IOSM
            FILES:=$(LINUX_DIR)/drivers/net/wwan/iosm/iosm.ko
            AUTOLOAD:=$(call AutoProbe,iosm)
          endef

          define KernelPackage/iosm/description
            Kernel module for Intel PCIe based WWAN modems (XMM7360/XMM7560/L860-GL)
          endef

          $(eval $(call KernelPackage,iosm))
          EOF

      - name: Compile kmod-iosm & kmod-wwan
        run: |
          cd sdk
          make defconfig
          echo "CONFIG_PACKAGE_kmod-wwan=m" >> .config
          echo "CONFIG_PACKAGE_kmod-iosm=m" >> .config
          make defconfig
          make package/kernel/linux/compile V=s -j$(nproc)

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kmod-iosm-immortalwrt-24.10.2-x86_64
          path: |
            sdk/bin/targets/x86/64/packages/kmod-iosm*.ipk
            sdk/bin/targets/x86/64/packages/kmod-wwan*.ipk
