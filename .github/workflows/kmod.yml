name: Build kmod iosm (ImmortalWrt)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi persis (contoh 24.10.2)"
        required: true
        default: "24.10.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Kosongkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pasang dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget libelf-dev

      - name: Clone ImmortalWrt
        run: git clone --depth 1 --branch v${{ inputs.version }} https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Tambah paket kmod-iosm
        working-directory: openwrt
        run: |
          grep -q "KernelPackage/wwan" package/kernel/linux/modules/wwan.mk || { echo "wwan.mk tidak punya kmod-wwan"; exit 1; }
          cat >> package/kernel/linux/modules/wwan.mk <<'EOF'

          define KernelPackage/iosm
            SUBMENU:=WWAN Support
            TITLE:=Intel IOSM WWAN driver (XMM7360/7560)
            DEPENDS:=@PCI_SUPPORT +kmod-wwan
            KCONFIG:=CONFIG_IOSM
            FILES:=$(LINUX_DIR)/drivers/net/wwan/iosm/iosm.ko
            AUTOLOAD:=$(call AutoProbe,iosm)
          endef

          define KernelPackage/iosm/description
            Driver kernel untuk modem Intel XMM7360/7560 (Fibocom L850/L860) mode PCIe.
          endef

          $(eval $(call KernelPackage,iosm))
          EOF

      - name: Konfigurasi
        working-directory: openwrt
        run: |
          curl -fL https://downloads.immortalwrt.org/releases/${{ inputs.version }}/targets/x86/64/config.buildinfo -o .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-iosm=m
          CONFIG_PACKAGE_kmod-wwan=m
          EOF
          make defconfig
          grep -q "CONFIG_PACKAGE_kmod-iosm=m" .config || { echo "kmod-iosm tidak aktif"; exit 1; }

      - name: Build toolchain, kernel, dan modul
        working-directory: openwrt
        run: |
          make download -j8
          make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install
          make -j$(nproc) target/linux/compile package/kernel/linux/compile || make -j1 V=s target/linux/compile package/kernel/linux/compile

      - name: Kumpulkan file
        working-directory: openwrt
        run: |
          mkdir -p ../out
          find bin -name "kmod-iosm_*.ipk" -exec cp {} ../out/ \;
          find bin -name "kmod-wwan_*.ipk" -exec cp {} ../out/ \;
          ls -lh ../out
          test -n "$(ls ../out/kmod-iosm_*.ipk)"

      - name: Upload ke Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kmod-${{ inputs.version }}-${{ github.run_number }}
          name: kmod iosm ImmortalWrt ${{ inputs.version }} (build ${{ github.run_number }})
          files: out/*.ipk
